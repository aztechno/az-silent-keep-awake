[package]
name = "az-silent-keep-awake"
version = "0.1.0"
edition = "2021"

[dependencies]
tray-icon    = "0.19"
keepawake    = "0.6"
cpal         = "0.15"
chrono       = "0.4"
ico          = "0.3"
hound        = "3.5"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
winreg       = "0.52"
windows-sys  = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"